# Quick Command Reference (Compose v2 syntax; v1 "docker-compose" is not installed):
# Build:    docker compose build
# Run:      docker compose up -d
# Logs:     docker compose logs -f
# Stop:     docker compose down
# Rebuild:  docker compose up -d --build

services:
  kvm-service:
    build: .
    image: kvm-as-a-service:latest
    container_name: kvm-service
    ports:
      - "8000:8000"
    privileged: true
    # devices:
      # NOT RECOMMENDED for this use case. `devices:` pins a specific device node at
      # container creation time; if /dev/ttyUSB0 doesn't exist yet, the container fails
      # to start. It also defeats AUTO discovery when the adapter re-enumerates as
      # ttyUSB1 after a replug. Use the bind mount below instead.
      # - /dev/ttyUSB0:/dev/ttyUSB0
    # Bind-mount the host /dev so the container sees a live view including hotplug events.
    # Without this, the container gets a static /dev snapshot from container creation time.
    # On a Raspberry Pi (slow USB enumeration) or when replugging adapters, the FT232R
    # can enumerate *after* the container starts — meaning /dev/ttyUSB0 exists on the host
    # but is invisible inside the container. This mount makes AUTO discovery and the
    # background reconnect loop in controller_service.py able to see late-arriving devices.
    # Keep `privileged: true` above to supply the cgroup device permissions.
    volumes:
      - /dev:/dev
    environment:
      # Configure the application to use the mapped serial port
      # Set to "AUTO" to automatically find the first available /dev/ttyUSB* or /dev/ttyACM*
      - SERIAL_PORT=AUTO
      # SV04 USB switch: 115200 only. Sending at any other rate latches up its
      # RS232 controller until the switch is power-cycled, so this must match
      # PROTOCOL below. For the TESmart KVMs use BAUD_RATE=9600, PROTOCOL=hdc202_x24.
      - BAUD_RATE=115200
      - PROTOCOL=sv04
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
