# Quick Command Reference:
# Build:    docker-compose build
# Run:      docker-compose up -d
# Logs:     docker-compose logs -f
# Stop:     docker-compose down
# Rebuild:  docker-compose up -d --build

services:
  kvm-service:
    build: .
    image: kvm-as-a-service:latest
    container_name: kvm-service
    ports:
      - "8000:8000"
    privileged: true
    # devices:
      # Map the host serial port to the container.
      # For "plug-and-play" (AUTO), we rely on 'privileged: true' to access /dev/ttyUSB*
      # If you prefer explicit mapping, uncomment below and set the correct path:
      # - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      # Configure the application to use the mapped serial port
      # Set to "AUTO" to automatically find the first available /dev/ttyUSB* or /dev/ttyACM*
      - SERIAL_PORT=AUTO
      - BAUD_RATE=9600
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
