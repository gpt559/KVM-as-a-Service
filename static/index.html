<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVM Control Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-online { background-color: #2ecc71; }
        .status-offline { background-color: #e74c3c; }
        
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .input-option {
            text-align: center;
        }
        
        /* Make radio buttons look like cards/buttons */
        .input-option input[type="radio"] {
            display: none;
        }

        .input-option label {
            display: block;
            padding: 1rem;
            border: 1px solid var(--muted-border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .input-option input[type="radio"]:checked + label {
            background-color: var(--primary);
            color: var(--primary-inverse);
            border-color: var(--primary);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem;
            background-color: var(--card-background-color);
            border-left: 5px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <main class="container">
        <!-- Header -->
        <nav class="header-nav">
            <ul>
                <li><strong>KVM Control</strong></li>
            </ul>
            <ul>
                <li><span id="api-status-dot" class="status-dot"></span> API</li>
                <li><span id="hw-status-dot" class="status-dot"></span> Hardware</li>
            </ul>
        </nav>

        <hr>

        <!-- Status Message -->
        <div id="status-message">
            <p><small>Checking connectivity...</small></p>
        </div>

        <!-- Input Selection -->
        <section>
            <h3>Input Selection</h3>
            <div class="input-grid">
                <!-- Generated 8 Ports -->
                <div class="input-option">
                    <input type="radio" name="kvm-port" id="port-1" value="1">
                    <label for="port-1">PC 1</label>
                </div>
                <div class="input-option">
                    <input type="radio" name="kvm-port" id="port-2" value="2">
                    <label for="port-2">PC 2</label>
                </div>
                <div class="input-option">
                    <input type="radio" name="kvm-port" id="port-3" value="3">
                    <label for="port-3">PC 3</label>
                </div>
                <div class="input-option">
                    <input type="radio" name="kvm-port" id="port-4" value="4">
                    <label for="port-4">PC 4</label>
                </div>
                <div class="input-option">
                    <input type="radio" name="kvm-port" id="port-5" value="5">
                    <label for="port-5">PC 5</label>
                </div>
                <div class="input-option">
                    <input type="radio" name="kvm-port" id="port-6" value="6">
                    <label for="port-6">PC 6</label>
                </div>
                <div class="input-option">
                    <input type="radio" name="kvm-port" id="port-7" value="7">
                    <label for="port-7">PC 7</label>
                </div>
                <div class="input-option">
                    <input type="radio" name="kvm-port" id="port-8" value="8">
                    <label for="port-8">PC 8</label>
                </div>
            </div>
        </section>

        <!-- Settings -->
        <section>
            <h3>Settings</h3>
            <div class="grid">
                <div>
                    <h5>Buzzer</h5>
                    <div role="group">
                        <button class="outline" id="btn-buzzer-on" onclick="setBuzzer('on')">On</button>
                        <button class="outline" id="btn-buzzer-off" onclick="setBuzzer('off')">Off</button>
                    </div>
                </div>
                <div>
                    <h5>Protocol Configuration</h5>
                    <label for="protocol-select">Protocol</label>
                    <select id="protocol-select" onchange="updateConfig()">
                        <option value="consumer_a" selected>Consumer A (Keypad)</option>
                        <option value="enterprise">Enterprise (Default)</option>
                        <option value="consumer_b">Consumer B (Routing)</option>
                        <option value="matrix">Matrix (ASCII)</option>
                        <option value="dual_monitor_hex">Dual-Monitor Hex</option>
                    </select>
                    
                    <label for="baudrate-select">Baud Rate</label>
                    <select id="baudrate-select" onchange="updateConfig()">
                        <option value="115200" selected>115200</option>
                        <option value="9600">9600</option>
                        <option value="38400">38400</option>
                    </select>

                    <label for="terminator-select">Command Terminator</label>
                    <select id="terminator-select" onchange="updateConfig()">
                        <option value="none" selected>None</option>
                        <option value="lf">LF (\n)</option>
                        <option value="cr">CR (\r)</option>
                        <option value="crlf">CRLF (\r\n)</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Diagnostics -->
        <section>
            <h3>Diagnostics</h3>
            <p>Run a comprehensive test of all Protocol, Baud Rate, and Terminator combinations, switching between Port 1 and 2.</p>
            <button id="btn-run-test" onclick="runDiagnostics()">Run Configuration Scanner</button>
            <details id="details-logs">
                <summary>Test Logs</summary>
                <pre id="test-logs" style="max-height: 300px; overflow-y: auto; background: var(--card-background-color); padding: 1rem; border-radius: var(--border-radius);">No logs yet.</pre>
            </details>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Action Successful</div>

    <script src="app.js"></script>
</body>
</html>
