<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Switch Control</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .status-online { background-color: #2ecc71; }
        .status-offline { background-color: #e74c3c; }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
        }

        .input-option {
            text-align: center;
        }

        /* Radio buttons are hidden; the label acts as the clickable card */
        .input-option input[type="radio"] {
            display: none;
        }

        .input-option label {
            display: block;
            padding: 1rem;
            border: 1px solid var(--muted-border-color);
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .input-option input[type="radio"]:checked + label {
            background-color: var(--primary);
            color: var(--primary-inverse);
            border-color: var(--primary);
        }

        /* Visual indicator while a switch command is awaiting hardware echo */
        .input-option label[aria-busy="true"] {
            opacity: 0.65;
            cursor: progress;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem;
            background-color: var(--card-background-color);
            border-left: 5px solid var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
            z-index: 1000;
            max-width: 360px;
        }
    </style>
</head>
<body>
    <main class="container">
        <!-- Header -->
        <nav class="header-nav">
            <ul>
                <li><strong>USB Switch</strong></li>
            </ul>
            <ul>
                <li><span id="api-status-dot" class="status-dot"></span> API</li>
                <li><span id="hw-status-dot" class="status-dot"></span> Hardware</li>
            </ul>
        </nav>

        <hr>

        <!-- Status Message -->
        <div id="status-message">
            <p><small>Checking connectivity...</small></p>
        </div>

        <!-- Connection info is read-only; configuration is set via environment variables
             in docker-compose.yml and must not be changeable from the UI — setting the
             wrong baud rate from the browser is what wedges the hardware. -->
        <section>
            <h3>Connection</h3>
            <p><small>Port: <span id="serial-port">—</span> &nbsp;&nbsp; Baud: <span id="baud-rate">—</span></small></p>
        </section>

        <!-- Input Selection -->
        <section>
            <h3>Input Selection</h3>
            <!-- Shared USB peripherals (keyboard, mouse) follow the selected input.
                 Switching away from this machine's input will detach them until you switch back. -->
            <p><small>Note: shared USB peripherals follow the active input. Switching away from this machine's input will detach them until you switch back.</small></p>
            <!-- Inputs 1–4 are generated by app.js using the PORT_COUNT constant -->
            <div id="input-grid" class="input-grid"></div>
        </section>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
